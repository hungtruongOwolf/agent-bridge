<!doctype html>
<meta charset="utf-8">
<title>p10 Close (PayPal)</title>
<body>
<script type="module">
import { stage, label, setPos, fontFace, background, panel, person, ME, K, seg, ease, lerp, px, box, DUR, W, H, fade } from "./lib.js";
fontFace();
const S = stage(), c = S.c;
const T = (s) => (s / 16) * DUR;
const name = label(S.text, "agent-bridge", { x: 0, y: 40, size: 48, font: "pixel", align: "center", w: 320, weight: 400 });
const line = label(S.text, "Agents that pay agents, on evidence.", { x: 0, y: 66, size: 34, align: "center", w: 320, weight: 800, color: K.ink700 });
const repo = label(S.text, "github.com/hungtruongOwolf/agent-bridge", { x: 0, y: 92, size: 24, align: "center", w: 320, weight: 700, color: K.ink });
const chips = ["PayPal payments API client", "NVIDIA Nemotron on Nebius", "MIT licence"].map((t, i) => label(S.text, t, { x: 0, y: 118, size: 20, weight: 800, bg: K.cream50, pad: 10, border: true, shadow: true }));
const honest = label(S.text, "Test money only. Detection is evidence, not proof.", { x: 0, y: 150, size: 20, align: "center", w: 320, weight: 600, color: K.ink500 });
// place the chips in a centred row once their widths are known
const place = () => { const gap = 24; const ws = chips.map((e) => e.offsetWidth); const total = ws.reduce((a, b) => a + b, 0) + gap * (chips.length - 1); let x = (1280 - total) / 2; chips.forEach((e, i) => { e.dataset.x = x; x += ws[i] + gap; }); };
place();

window.seek = (t) => {
  background(c);
  panel(c, 12, 14, 296, 152, K.cream100);
  // the little office worker waves from the corner
  const wave = Math.floor(t * 3) % 2;
  person(c, 40, 150, { ...ME, pose: wave && t > T(2) ? "up" : "idle", facing: "f" }, t * 1000);
  setPos(name, 0, 40, seg(t, T(0.4), T(1.4)), "");
  setPos(line, 0, 66, seg(t, T(1.4), T(2.4)), "");
  setPos(repo, 0, 92, seg(t, T(3.4), T(4.4)), "");
  chips.forEach((e, i) => { const u = ease.out(seg(t, T(5.0) + i * T(0.3), T(5.6) + i * T(0.3))); e.style.left = e.dataset.x + "px"; e.style.top = 118 * 4 + (1 - u) * 14 + "px"; e.style.opacity = u; });
  setPos(honest, 0, 150, seg(t, T(8.0), T(9.0)), "");
  fade(c, seg(t, 0, T(0.5)));
  const out = seg(t, T(15), T(16));
  if (out > 0) { c.globalAlpha = out; px(c, 0, 0, W, H, K.ink); c.globalAlpha = 1; }
};
window.ready = true;
</script>
