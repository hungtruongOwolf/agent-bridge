const dk = (html, o = {}) => { const d = tag(html, { color: K.cream50, ...o }); if (!o.bg) d.style.textShadow = "0 2px 0 rgba(0,0,0,.45)"; return d; };

const t1 = dk("Hold", { size: 34 }), t2 = dk("Helper shut down<br>mid-run", { size: 28 }), t3 = dk("Money<br>stays held", { size: 28 });

const tFl = dk("Flagged", { size: 30, color: "#D2E7DA" }), tNf = dk("Not flagged", { size: 30, color: "#F6DE9E" });

function round(c, x, y, r, fill, line = K.ink) {
  for (let dy = -r - 1; dy <= r + 1; dy++) { const h = Math.round(Math.sqrt(Math.max(0, (r + 1) * (r + 1) - dy * dy))); px(c, x - h, y + dy, h * 2 + 1, 1, line); }

}
const coinR = (c, x, y, r, spin = 0) => { const k = 0.35 + 0.65 * Math.abs(Math.cos(spin)); c.save(); c.translate(x, y); c.scale(k, 1); round(c, 0, 0, r, K.lemon); round(c, 0, 0, Math.max(1, r - 2), "#EBC15C", "#C08F26"); c.restore(); };

/* a glowing node box */
function node(c, cx, cy, w, h, col, u, bright = 1) {
  if (u <= 0) return;
  c.save(); c.translate(cx, cy); c.scale(u, u); c.globalAlpha = Math.min(1, u * 1.5) * bright;

  c.restore(); c.globalAlpha = 1;
}
/* a line drawn out to u (0..1) along points, with a glow and flowing dots */
function trace(c, t, pts, u, col, bright = 1, dots = true) {
  if (u <= 0) return;
  let total = 0; const segs = []; for (let i = 1; i < pts.length; i++) { const l = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); segs.push(l); total += l; }

}
const HAND = ["X.......", "XX......", "XXX.....", "XXXX....", "XXXXX...", "XXXXXX..", "XXXXXXX.", "XXXXX...", "XX.XX...", "X..XX...", "...XX..."];
function hand(c, x, y, press) {

  HAND.forEach((row, j) => { for (let i = 0; i < row.length; i++) if (row[i] === "X") px(c, x + i, y + j + press, 1, 1, K.cream50); });
}
const buf = (u) => spring(u, 8, 0.55);

}

function world(t, p) {

    const t0 = tG + 1.3 + i * 0.28, u = seg(t, t0, t0 + 0.85);
    if (u > 0 && u < 1) { const q = arc(POT, [BUYER[0] + 2, BUYER[1] - 26], ease.inOut(u), 38 + i * 4); coinR(c, q.x, q.y, 3, t * 9); if (i < 5) { c.globalAlpha = 0.4; px(c, q.x - 3, q.y + 3, 1, 1, K.lemonL); c.globalAlpha = 1; } }
    if (u >= 1 && t < tA + 0.2) { const k = (t - t0 - 0.85); if (k < 0.6) burst(c, t, t0 + 0.85, BUYER[0] + 2, BUYER[1] - 26, { n: 8, speed: 20, life: 0.5, colors: [K.lemon, K.cream50, K.mint], seed: 30 + i, gravity: 10 }); }
  }
  if (t > tG + 2.8 && t < tA) for (let i = 0; i < 3; i++) sparkle(c, BUYER[0] - 12 + i * 12 + Math.sin(t * 4 + i) * 2, BUYER[1] - 36 - Math.abs(Math.sin(t * 3 + i)) * 4, 1 + Math.round(Math.abs(Math.sin(t * 5 + i * 2)) * 2), K.cream50);
  // not flagged: one small coin to the author, the rest back to the buyer
  { const t0 = tA + 1.2, u = seg(t, t0, t0 + 1.0);
    if (u > 0 && u < 1) { const q = arc(POT, [AUTHOR[0], AUTHOR[1] - 28], ease.inOut(u), 70); coinR(c, q.x, q.y, 3, t * 9); }
    if (u >= 1) { coinR(c, AUTHOR[0] + 1, AUTHOR[1] - 30 + Math.sin(t * 3) * 1.2, 3); burst(c, t, t0 + 1.0, AUTHOR[0], AUTHOR[1] - 28, { n: 20, speed: 40, life: 0.9, colors: [K.lemon, K.cream50, K.mint, K.coral], seed: 41, gravity: 30 }); }
    for (let i = 0; i < 3; i++) { const tb = tA + 1.5 + i * 0.3, ub = seg(t, tb, tb + 0.85); if (ub > 0 && ub < 1) { const q = arc(POT, [BUYER[0] + 2, BUYER[1] - 26], ease.inOut(ub), 40); coinR(c, q.x, q.y, 3, t * 9); } }
  }
  return { gu, au, chipU };
}

window.seek = (t) => {
  const p = cam.at(t);
  let info; cam.apply(c, t, () => { info = world(t, p); });
  vignette(c, 0.35);
  fade(c, seg(t, 0, 0.3));
  wHead.update(t);
  const at = (el, x, y, u, a = 1, k = 1) => putW(el, t, x, y, clamp(u * 2) * a, Math.max(0.01, u) * k);
  const x1 = 66, x2 = 178, x3 = 290, y = 48;
  at(t1, x1, y, buf(seg(t, tN1 + 0.1, tN1 + 0.6)));
  at(t2, x2, y, buf(seg(t, tN2 + 0.1, tN2 + 0.6)));
  at(t3, x3, y, buf(seg(t, tN3 + 0.1, tN3 + 0.6)));
  const bu = buf(seg(t, tBtn, tBtn + 0.5)), press = t > tPress && t < tPress + 0.2 ? 2 : 0, ref = seg(t, tRef, tRef + 0.8);
  const sh = t > tRef && ref < 1 ? Math.sin(t * 70) * 2.5 * (1 - ref) : 0;
  const fadeBtn = (1 - 0.6 * seg(t, s[3].a + 0.3, s[3].a + 0.8)) * (1 - seg(t, tCert + 0.3, tCert + 0.8));
  at(tBtnT, 302 + sh, 102 + press, bu, fadeBtn * (t > tRef ? 0.35 : 1));
  at(tWord, 320, 80, buf(seg(t, tBtn + 0.4, tBtn + 0.9)), fadeBtn);
  at(tRefuse, 290, 136, buf(seg(t, tRef + 0.3, tRef + 0.8)), 1 - seg(t, s[3].a + 0.2, s[3].a + 0.6));
  at(tCertT, CX, 176 + 0, buf(seg(t, tCert + 0.3, tCert + 0.8)), 1 - seg(t, tBr - 0.3, tBr + 0.2));
  at(tHelp, 212, 162, buf(seg(t, tCert + 0.3, tCert + 0.8)), 1 - seg(t, tBr - 0.3, tBr + 0.2));
  at(tFl, XL, 188, info.chipU, t < tA - 0.2 ? 1 : 0.5);
  at(tNf, XR, 188, info.chipU, t < tG ? 0.95 : (t < tA - 0.2 ? 0.45 : 1));
  at(tOutG, XL, 232, info.gu, t < tA - 0.1 ? 1 : 0.5);
  at(tOutA, XR, 232, info.au);
  const bvis = buf(seg(t, tG + 0.9, tG + 1.4)) ;
  at(tBuy, BUYER[0] + 28, BUYER[1] - 12, bvis);
  at(tAuth, AUTHOR[0] - 30, AUTHOR[1] - 12, buf(seg(t, tG + 1.0, tG + 1.5)));
  at(tZero, AUTHOR[0] - 8, AUTHOR[1] - 44, buf(seg(t, tG + 2.4, tG + 2.9)), 1 - seg(t, tA - 0.4, tA));
};
window.ready = true;
</script>
