<!doctype html>
<meta charset="utf-8">
<title>caption</title>
<body style="margin:0;background:transparent">
<style>
@font-face{font-family:"Inter";font-weight:100 900;src:url("/src/bridge/web/static/fonts/inter-latin-var.woff2") format("woff2")}
html{background:transparent}
#box{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);max-width:1080px;box-sizing:border-box;padding:12px 26px;background:#FFF8E7;border:4px solid #1A1320;box-shadow:6px 6px 0 rgba(26,19,32,.28);font:800 30px/1.3 Inter,system-ui,sans-serif;color:#1A1320;text-align:center}
#note{display:block;margin-top:4px;font:600 21px/1.3 Inter,system-ui,sans-serif;color:#6B5878}
</style>
<div id="box"><span id="t"></span><span id="note"></span></div>
<script>
const q = new URLSearchParams(location.search);
document.getElementById("t").textContent = q.get("text") || "";
const n = q.get("note");
if (n) document.getElementById("note").textContent = n; else document.getElementById("note").remove();
window.seek = () => {}; window.ready = true;
</script>
