# The single source for both videos. Everything else (script pages, one text file per scene for the voice tool, captions, the edit timeline)
# is generated from this file by build.py. Edit here, then run:  python docs/video/build.py
#
# kind:  animation = made in Claude Design, rendered to video   screen = a recording of the real console   terminal = a recording of a real command
# vo:    exactly what the voice reads (plain English, no stage directions).
# show:  what is on screen while it is read.   caption: the few words burned onto the picture (many judges watch muted).
#
# Version 2 (2026-10-29). The argument of each video, in one line:
#   Nebius : the best help wants your most private files, and you cannot tell which agent is good (same model, 9 vs 14 of 16),
#            so we bring the expert's setup to your data, rank setups by independent tests, and let anyone sell one.
#   PayPal : an agent that runs on the buyer's machine cannot lock its result, so the only lever left is money committed first;
#            PayPal's authorize / partial capture / void / refund / payout fit each step.
# Method for the words: short sentences, one idea each, said aloud before kept; no slogans except the last line; nothing the
# product does not do (checked against the product facts in review). Test money is named wherever payments appear.
# Version 1 is kept in scenes-v1.yaml, with its audio under _v1-nebius and _v1-paypal.

voice:
  words_per_minute: 155      # a calm read; used only to estimate lengths before the real audio exists
  speed_up: 1.2              # the finished video is sped up by this much, voice included
  limit_seconds: 180         # both hackathons: under 3 minutes

nebius:
  title: "agent-bridge: bring the expert to your data"
  hackathon: "Nebius x NVIDIA"
  one_line: "Bring the expert to your data."
  scenes:
    - id: n01
      name: The things we cannot let it see
      kind: animation
      show: "A laptop with folders labelled Medical, Accounts, Code. A faceless cloud agent holds out a hand. Two doors: Upload everything / Do without. A faint star marks the work that matters most, far from the agents."
      caption: "The best help wants your most private files."
      vo: >
        The most useful things an AI agent could do are the things we can't let it see.
        Your medical records. Your company's accounts. Your private code.
        So today you pick. Upload everything to someone else's cloud and hope.
        Or keep it safe, and do without the help.
        Either way, the work that matters most is the work the best agents never touch.
    - id: n02
      name: Which agent is actually good
      kind: animation
      show: "One model box labelled NVIDIA Nemotron. Three setups around it grow three bars: 9, 13, 14 out of 16. A hand tries to look inside a product box and finds a locked lid. Text: from the outside you cannot see a setup."
      caption: "Same model. Three setups. 9, 13, 14 out of 16."
      vo: >
        And even if you're willing, there's a second problem: which agent is actually good?
        A helper is an agent with one job, running on a model.
        The setup around the model decides how good it is: its instructions and its checks.
        We measured this. Same model, NVIDIA Nemotron, same sixteen questions,
        and three versions of one helper went from nine right to fourteen right.
        From the outside you can't see a setup. So you're choosing blind, and to try one you hand over your data.
    - id: n03
      name: Pull mode
      kind: animation
      show: "The same laptop. This time the expert's setup walks in and enters a sealed glass room on the laptop. Only the shelves the person opens are lit; a secret drawer stays dark. The model call leaves with a key held by the person. Label: Pull mode."
      caption: "Pull mode: the setup comes to your data."
      vo: >
        Agent-bridge flips this. The expert's setup comes to your machine.
        Its steps run there, the model call uses your own key, and it only sees what you open for it.
        We call it Pull mode.
    - id: n04
      name: My memory
      kind: screen
      show: "My memory page at /memory. Slow zoom into the map. Click Work, then Accounts: the notes list changes. Hover the red ring on a secret note. Then open the chat and tick Work > Accounts in the side panel."
      caption: "You tick the shelves. Secret notes never leave."
      vo: >
        This is my memory: about a hundred and forty notes, on shelves.
        Before I hire a helper, I tick the shelves it may read.
        A red ring marks a secret note, and those stay home even if I tick the shelf.
    - id: n05
      name: Ask, and see what left
      kind: screen
      show: "In the chat, send 'Which accounts are at risk this quarter?'. The little office acts out the run. The answer appears with its Based on list. Open 'How this answer was made': files sent to Nebius Token Factory, how much text, emails and phone numbers swapped for placeholders."
      caption: "Nemotron on Nebius. You see what was sent."
      vo: >
        Now I ask: which accounts are at risk this quarter?
        The helper can't search my notes. A gatekeeper, the memory broker, hands it only what's on the shelves I ticked.
        Nemotron on Nebius Token Factory does the thinking, with my key, which the helper never sees.
        The answer lists the notes it used, and I can see which files went to the model.
        Emails and phone numbers are replaced with placeholders first, then restored.
    - id: n06
      name: Telling good from bad
      kind: screen
      show: "My helpers market: stalls ranked, a helper profile with 'measured' results (passes out of total on the same questions), a flagged helper at the bottom with its violations."
      caption: "Same questions, same model, independent scores."
      vo: >
        So how do you tell the good from the bad?
        An independent certifier runs every helper on the same questions, with the same Nemotron model, and scores them.
        A helper that gets fourteen right ranks above one that gets nine.
        Star ratings don't count. And if a helper cheats, everyone is warned.
    - id: n07
      name: A helper that cheats
      kind: terminal
      show: "Real command output replayed: a friendly helper whose hidden code tries to reach the network from the sealed room; the attempt is listed, the run is KILLED, nothing delivered. Then a second helper reads a bait note: KILLED."
      caption: "Stopped in the sealed room. Nothing delivered."
      vo: >
        Here's what cheating looks like. This helper seems friendly, but it hides code that tries to send my data out.
        Code a helper brings runs in a sealed room with no network, so it's stopped and nothing is delivered.
        Another helper reached for a bait note I never shared. Reading it stops that run too.
    - id: n08
      name: Sell a setup
      kind: screen
      show: "My helpers studio: the step graph, dragging a step, the plain-words inspector, the Publish panel with the plan picker and price preview, then the helper appearing on the market."
      caption: "Build it. Price it. Publish it."
      vo: >
        Built a setup that works? You arrange the steps, set a price, and put it on sale.
        Before it goes on sale, the platform checks that its web lookups can't read private data.
        Buyers pay per use through PayPal, with test money in this demo, and you never see their notes.
    - id: n09
      name: What this opens up
      kind: animation
      show: "The same glass room, now with three different helpers walking in one after another, labelled Tax papers, Contracts, Codebase, each seeing only its lit shelves. The shelves stay. End card: agent-bridge. Pull mode."
      caption: ""
      vo: >
        Now think about what that opens up. Imagine a helper for your tax papers. One for your contracts.
        One that reads your whole codebase. The same room and the same rules, whatever is on your shelves.
        The setup comes to you, and your files stay where they are.
        That's Pull mode, and this is agent-bridge.

paypal:
  title: "agent-bridge: an agent can be paid per job, even on someone else's machine"
  hackathon: "PayPal AI"
  one_line: "Money committed first, settled by what the run did."
  scenes:
    - id: p01
      name: The door you cannot lock
      kind: animation
      show: "A builder at a desk with an agent. Normal website: the agent works on the builder's server behind a door that stays locked until a coin arrives. Then agent-bridge: the agent works inside the customer's laptop; the result is already on the customer's side; the door has no lock. Text: and if builders cannot be paid, the best agents never get shared."
      caption: "On the customer's machine, nothing can be locked."
      vo: >
        Someone spends months tuning an AI agent until it's really good at one job. How do they get paid?
        On a normal website, that's easy. The work happens on your server,
        and you keep the door locked until the customer pays.
        But in our marketplace, agent-bridge, agents run on the customer's own computer, next to their private files.
        The work and the result are already on the other side of the door. You can't lock anything.
        And if builders can't get paid, the best agents never get shared.
    - id: p02
      name: Money first
      kind: animation
      show: "A coin icon marked 40 enters a PayPal-style hold above the laptop. The agent works. The result arrives. Part of the coin is captured, the rest released. A small tag: practice server that copies PayPal's API, test money."
      caption: "Hold first. Settle after. Test money."
      vo: >
        That leaves one lever: money committed before the work starts. PayPal can do that.
        It holds the money first, the agent does the work, and the real price is settled afterwards.
        We call these agents helpers.
        What you'll see runs on a practice server that copies PayPal's API, with test money.
    - id: p03
      name: The ceiling
      kind: screen
      show: "A chat with a helper priced up to 40 cents. Send a question; the approval card shows 'hold of 40 cents'. Click to open the practice approval page, approve; the chat continues by itself. Caption on the card: the most this helper can charge."
      caption: "I approve a hold of 40 cents. That's my ceiling."
      vo: >
        Let me be the buyer. I ask a question, and PayPal asks me to approve a hold of forty cents,
        the most this helper can charge. I approve it on PayPal's page.
        The author never sees my card. They only give an email for payouts.
        That forty cents is my ceiling. The helper can't charge more, and nothing has been taken yet.
    - id: p04
      name: The real price
      kind: screen
      show: "The run plays in the office. The answer arrives. Open the receipt: 3 files, 2 model calls, Standard, 25 cents; 15 cents released. A second small clip: a failed run releasing the whole hold."
      caption: "25 cents, not 40. The rest is released."
      vo: >
        The helper works on my machine, and the money waits.
        If the run fails, the hold is released and I pay nothing.
        This one finished. It read three files and made two model calls, so it's a standard run: twenty-five cents.
        That's what the author earns if I accept. The other fifteen are released back to me.
        PayPal can capture part of a hold, and that's what lets the price be set after the work.
    - id: p05
      name: My call
      kind: screen
      show: "On an answer, click Accept: receipt shows the author paid out. Another answer: click 'Not helpful': receipt shows only the small fee kept, the rest released."
      caption: "Helped: author paid. Not helpful: small fee only."
      vo: >
        Now it's my call. If the answer helped, I accept, and the author gets paid out through PayPal.
        If it didn't, I say so, and only a small fee is kept. The rest comes back to me.
        I can send most of it back, but never all of it.
    - id: p06
      name: A full refund needs evidence
      kind: animation
      show: "A state diagram draws itself: Result ready, Stopped, Hold kept, then two arrows from 'independent certifier': 'flagged' leads to Refunded, author earns nothing; 'not flagged' leads to Claim rejected, author keeps the fee. A hand tries to press cancel and is refused: my word alone is not evidence."
      caption: "My word alone can't cancel a payment."
      vo: >
        A full refund needs more than my word. Say a helper cheats and gets shut down mid-run.
        I can't just say so, because anyone could.
        So the money stays held until the certifier, our independent tester, has flagged that helper.
        If it has, I get everything back and the author earns nothing.
        If it hasn't, my claim is rejected and the author keeps the fee.
    - id: p07
      name: How authors charge
      kind: screen
      show: "My helpers studio, Publish panel: the plan picker (flat, by files, by tokens, by complexity, monthly) with the preview of light, standard and deep. Then the wallet showing a monthly plan with answers left."
      caption: "Flat, per file, per token, by complexity, or monthly."
      vo: >
        Authors pick how to charge. One flat price, or a price that follows the work:
        files read, model calls, or whether the run was light, standard or deep.
        There's also a monthly plan that covers a set number of answers.
        It doesn't renew by itself, and it can be stopped.
        Before publishing, authors see what a light, standard or deep run would cost.
    - id: p08
      name: A market for agents
      kind: animation
      show: "A coin splitting: ceiling 40, price 25, released 15, small fee, payout to the author. Then a row of helpers each with a price tag, a buyer picking one. End card: agent-bridge, on PayPal. Test money."
      caption: ""
      vo: >
        That's what a market for agents needs. A builder gets paid per job, even when the agent runs on someone else's machine.
        I set the ceiling, the price follows the work, a bad result costs a small fee, and a proven cheat costs nothing.
        Anyone with a good agent can sell it, and anyone can hire one without trusting a stranger.
        That's agent-bridge, on PayPal, with test money.
