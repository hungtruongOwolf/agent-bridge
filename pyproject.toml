[project]
name = "agent-bridge"
version = "0.0.1"
description = "Marketplace of agent + harness packs with Pull-mode isolation"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["PyYAML>=6", "jsonschema>=4", "cryptography>=42"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
bridge = "bridge.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
"bridge.web" = ["static/*", "static/fonts/*", "static/vendor/*/*", "static/js/*.js", "static/js/*/*.js", "static/js/package.json"]
"bridge.hub" = ["suites/*.yaml"]
