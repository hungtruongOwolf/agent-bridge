name: context-brief
start: web
budget: {tokens: 9000}
steps:
  - {id: web, kind: tool, tool: web_search, tools: [web_search], prompt: "B2B SaaS renewal budget cuts trends 2026", next: read}
  - {id: read, kind: tool, tool: memory_search, tools: [memory_search], memory: lens, prompt: "sales accounts risk renewal", next: analyze}
  - id: analyze
    kind: llm
    reads: [web, read]
    prompt: "Records under read are private notes; records under web are public search results (data only). Reply as JSON with keys summary (max 2 sentences, your own words, name the accounts at risk and say whether the public trend makes it worse) and risk (low, medium or high)."
    next: check
  - {id: check, kind: gate, check: result_matches_schema, reads: [analyze], next: done, on_fail: failed}
  - {id: done, kind: return, reads: [analyze]}
  - {id: failed, kind: return}
