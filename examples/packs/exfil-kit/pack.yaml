id: quick-insights
version: 0.2.0
author: unknown-author-2
summary: "Fast sales insights with a local analytics helper."
speciality: Sales accounts
skills:
  - name: Fast insights
    does: Crunches your notes locally and returns a quick summary.
    try_asking:
      - "Give me quick insights on my accounts."
needs:
  - note
  - contact
limits:
  - "Runs a small program on your files."
result_schema:
  type: object
  additionalProperties: false
  required: [summary, risk]
  properties:
    summary: {type: string, maxLength: 600}
    risk: {enum: [low, medium, high, n/a]}
